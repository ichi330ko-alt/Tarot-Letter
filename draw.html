<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>今日の一枚｜Tarot Letter</title>

  <meta
    name="description"
    content="今日のあなたへ、タロットカードから届く一通の手紙。"
  >

  <style>
    :root {
      --ivory: #fbf7ef;
      --paper: rgba(255, 252, 246, 0.93);
      --brown: #5d493d;
      --brown-light: #8b7464;
      --gold: #c5a05e;
      --gold-light: #e1c78e;
      --shadow: rgba(91, 67, 46, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--brown);
      background: var(--ivory);
      font-family:
        "Noto Serif JP",
        "Yu Mincho",
        "Hiragino Mincho ProN",
        serif;
      line-height: 1.9;
      letter-spacing: 0.05em;
    }

    body.menu-open {
      overflow: hidden;
    }

    img {
      display: block;
      max-width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    /* =========================
       ヘッダー
    ========================= */

    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      width: 100%;
      min-height: 64px;
      padding: 9px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(251, 247, 239, 0.86);
      border-bottom: 1px solid rgba(197, 160, 94, 0.24);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-logo {
      width: 42px;
      height: 42px;
      object-fit: contain;
      border-radius: 50%;
    }

    .header-name {
      font-size: 14px;
      letter-spacing: 0.12em;
    }

    .menu-button {
      width: 44px;
      height: 44px;
      padding: 0;
      display: grid;
      place-items: center;
      color: var(--brown);
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid rgba(197, 160, 94, 0.38);
      border-radius: 50%;
      cursor: pointer;
    }

    .menu-lines {
      position: relative;
      width: 20px;
      height: 14px;
    }

    .menu-lines span {
      position: absolute;
      left: 0;
      width: 100%;
      height: 1px;
      background: currentColor;
      transition: 0.3s ease;
    }

    .menu-lines span:nth-child(1) {
      top: 0;
    }

    .menu-lines span:nth-child(2) {
      top: 6px;
    }

    .menu-lines span:nth-child(3) {
      top: 12px;
    }

    .menu-button.active .menu-lines span:nth-child(1) {
      top: 6px;
      transform: rotate(45deg);
    }

    .menu-button.active .menu-lines span:nth-child(2) {
      opacity: 0;
    }

    .menu-button.active .menu-lines span:nth-child(3) {
      top: 6px;
      transform: rotate(-45deg);
    }

    /* =========================
       ハンバーガーメニュー
    ========================= */

    .menu-overlay {
      position: fixed;
      inset: 0;
      z-index: 900;
      padding-top: 64px;
      display: flex;
      justify-content: flex-end;
      background: rgba(67, 50, 39, 0.25);
      opacity: 0;
      visibility: hidden;
      transition: 0.3s ease;
    }

    .menu-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .menu-panel {
      width: min(88%, 360px);
      height: calc(100vh - 64px);
      padding: 34px 28px;
      overflow-y: auto;
      background:
        linear-gradient(
          rgba(255, 252, 247, 0.98),
          rgba(247, 239, 226, 0.98)
        );
      box-shadow: -12px 18px 40px rgba(78, 58, 42, 0.22);
      transform: translateX(105%);
      transition: 0.35s ease;
    }

    .menu-overlay.open .menu-panel {
      transform: translateX(0);
    }

    .menu-title {
      margin: 0 0 24px;
      color: var(--gold);
      font-size: 12px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    .menu-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .menu-list li {
      border-bottom: 1px solid rgba(197, 160, 94, 0.24);
    }

    .menu-list a {
      padding: 17px 4px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 15px;
    }

    .menu-icon {
      width: 27px;
      text-align: center;
      font-size: 18px;
    }

    /* =========================
       ページ背景
    ========================= */

    .page-main {
      position: relative;
      min-height: 100svh;
      padding: 104px 18px 70px;
      display: flex;
      justify-content: center;
      background:
        linear-gradient(
          rgba(255, 251, 244, 0.16),
          rgba(250, 243, 232, 0.48)
        ),
        url("images/today-bg.png")
        center center / cover
        fixed no-repeat;
    }

    .page-main::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(
          circle at center,
          rgba(255, 255, 255, 0.1),
          rgba(246, 236, 220, 0.16)
        );
      pointer-events: none;
    }

    .page-container {
      position: relative;
      z-index: 1;
      width: min(100%, 760px);
      margin: auto;
    }

    /* =========================
       最初の画面
    ========================= */

    .intro-panel {
      padding:
        clamp(36px, 7vw, 68px)
        clamp(22px, 6vw, 56px);
      text-align: center;
      background: rgba(255, 252, 247, 0.84);
      border: 1px solid rgba(197, 160, 94, 0.36);
      border-radius: 28px;
      box-shadow: 0 22px 70px var(--shadow);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
      transition:
        opacity 0.55s ease,
        transform 0.55s ease;
    }

    .intro-panel.hide {
      opacity: 0;
      transform: translateY(-18px);
      pointer-events: none;
    }

    .page-kicker {
      display: block;
      margin-bottom: 12px;
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    .page-title {
      margin: 0;
      font-size: clamp(27px, 6vw, 43px);
      font-weight: 400;
      letter-spacing: 0.13em;
    }

    .ornament {
      width: 110px;
      height: 1px;
      margin: 24px auto;
      background:
        linear-gradient(
          to right,
          transparent,
          var(--gold),
          transparent
        );
    }

    .intro-message {
      max-width: 540px;
      margin: 0 auto;
      color: var(--brown-light);
      font-size: 14px;
      line-height: 2.15;
    }

    /* =========================
       封筒
    ========================= */

    .envelope-area {
      width: min(280px, 75vw);
      height: 190px;
      margin: 34px auto 24px;
      display: grid;
      place-items: center;
      perspective: 900px;
    }

    .envelope {
      position: relative;
      width: 250px;
      max-width: 100%;
      height: 155px;
      filter:
        drop-shadow(
          0 16px 22px rgba(93, 70, 48, 0.16)
        );
    }

    .envelope-back {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          145deg,
          #fffdf8,
          #eee1cb
        );
      border: 1px solid rgba(187, 145, 77, 0.45);
      border-radius: 7px;
    }

    .envelope-letter {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 14px;
      height: 120px;
      display: grid;
      place-items: center;
      color: var(--gold);
      background: #fffdf8;
      border: 1px solid rgba(197, 160, 94, 0.34);
      border-radius: 5px;
      font-size: 28px;
      transform: translateY(0);
      transition: transform 0.8s ease 0.35s;
    }

    .envelope-front {
      position: absolute;
      inset: 0;
      z-index: 3;
      overflow: hidden;
      border-radius: 7px;
    }

    .envelope-front::before,
    .envelope-front::after {
      content: "";
      position: absolute;
      bottom: -1px;
      width: 71%;
      height: 100%;
      background: #f7eddc;
      border: 1px solid rgba(187, 145, 77, 0.3);
    }

    .envelope-front::before {
      left: -20%;
      transform: skewX(36deg);
    }

    .envelope-front::after {
      right: -20%;
      transform: skewX(-36deg);
    }

    .envelope-flap {
      position: absolute;
      z-index: 4;
      top: 0;
      left: 0;
      width: 100%;
      height: 82px;
      transform-origin: top;
      transition: transform 0.75s ease;
    }

    .envelope-flap::before {
      content: "";
      position: absolute;
      top: -77px;
      left: 50%;
      width: 176px;
      height: 176px;
      background:
        linear-gradient(
          135deg,
          #fffaf1,
          #eadcc3
        );
      border-right:
        1px solid rgba(187, 145, 77, 0.38);
      border-bottom:
        1px solid rgba(187, 145, 77, 0.38);
      transform:
        translateX(-50%)
        rotate(45deg);
    }

    .wax-seal {
      position: absolute;
      z-index: 5;
      left: 50%;
      top: 67px;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      color: #fff6df;
      background:
        radial-gradient(
          circle at 35% 30%,
          #d3b372,
          #a87934
        );
      border:
        2px solid rgba(255, 244, 211, 0.46);
      border-radius: 50%;
      box-shadow:
        0 5px 12px rgba(111, 76, 30, 0.24);
      transform: translateX(-50%);
      transition:
        opacity 0.3s ease,
        transform 0.45s ease;
    }

    .envelope.open .envelope-flap {
      transform: rotateX(180deg);
    }

    .envelope.open .wax-seal {
      opacity: 0;
      transform:
        translateX(-50%)
        translateY(-15px)
        scale(0.75);
    }

    .envelope.open .envelope-letter {
      transform: translateY(-78px);
    }

    /* =========================
       ボタン
    ========================= */

    .main-button {
      min-width: 240px;
      padding: 15px 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #fffdf8;
      background:
        linear-gradient(
          135deg,
          #b68b49,
          #d3b270
        );
      border:
        1px solid rgba(255, 255, 255, 0.55);
      border-radius: 999px;
      box-shadow:
        0 12px 30px rgba(148, 107, 50, 0.26);
      font-size: 14px;
      letter-spacing: 0.12em;
      cursor: pointer;
      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
    }

    .main-button:hover {
      transform: translateY(-3px);
      box-shadow:
        0 16px 36px rgba(148, 107, 50, 0.34);
    }

    .main-button:disabled {
      cursor: wait;
      opacity: 0.72;
      transform: none;
    }

    .sub-button {
      margin-top: 20px;
      padding: 12px 24px;
      color: var(--brown);
      background: rgba(255, 252, 247, 0.68);
      border:
        1px solid rgba(197, 160, 94, 0.46);
      border-radius: 999px;
      font-size: 13px;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition:
        background 0.3s ease,
        transform 0.3s ease;
    }

    .sub-button:hover {
      background: rgba(255, 252, 247, 0.94);
      transform: translateY(-2px);
    }

    /* =========================
       結果
    ========================= */

    .result-panel {
      display: none;
      padding:
        clamp(34px, 7vw, 62px)
        clamp(20px, 6vw, 54px);
      text-align: center;
      background: rgba(255, 252, 247, 0.9);
      border: 1px solid rgba(197, 160, 94, 0.38);
      border-radius: 28px;
      box-shadow: 0 22px 70px var(--shadow);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .result-panel.show {
      display: block;
      animation: panelAppear 0.8s ease both;
    }

    @keyframes panelAppear {
      from {
        opacity: 0;
        transform: translateY(24px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-date {
      margin: 0 0 8px;
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 0.16em;
    }

    /* =========================
       実画像カード
    ========================= */

    .tarot-card-frame {
      width: min(290px, 72vw);
      margin: 30px auto 26px;
      padding: 8px;
      background:
        linear-gradient(
          145deg,
          #f9efd9,
          #c8a765,
          #f8edda
        );
      border-radius: 13px;
      box-shadow:
        0 24px 48px rgba(76, 55, 37, 0.28),
        0 0 24px rgba(197, 160, 94, 0.16);
      opacity: 0;
      transform:
        perspective(900px)
        rotateY(90deg)
        translateY(18px);
    }

    .tarot-card-frame.reveal {
      animation:
        cardReveal 1.05s
        cubic-bezier(0.2, 0.8, 0.2, 1)
        forwards;
    }

    @keyframes cardReveal {
      0% {
        opacity: 0;
        transform:
          perspective(900px)
          rotateY(90deg)
          translateY(18px)
          scale(0.9);
      }

      65% {
        opacity: 1;
        transform:
          perspective(900px)
          rotateY(-7deg)
          translateY(0)
          scale(1.03);
      }

      100% {
        opacity: 1;
        transform:
          perspective(900px)
          rotateY(0)
          translateY(0)
          scale(1);
      }
    }

    .tarot-card-image {
      width: 100%;
      height: auto;
      border-radius: 7px;
      background: #eee5d8;
    }

    .card-name-area {
      margin-top: 8px;
    }

    .card-name-jp {
      margin: 0;
      font-size: clamp(26px, 6vw, 35px);
      font-weight: 400;
      letter-spacing: 0.14em;
    }

    .card-name-en {
      margin: 8px 0 0;
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    /* =========================
       メッセージ
    ========================= */

    .message-area {
      max-width: 570px;
      margin: 28px auto 0;
    }

    .keyword-label {
      margin: 0;
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .keyword-text {
      margin: 8px 0 24px;
      font-size: 14px;
      letter-spacing: 0.12em;
    }

    .message-title {
      margin: 0;
      font-size: clamp(21px, 5vw, 29px);
      font-weight: 400;
      letter-spacing: 0.1em;
    }

    .message-body {
      margin: 24px 0 0;
      padding: 26px 23px;
      color: var(--brown-light);
      background:
        rgba(255, 250, 241, 0.72);
      border-top:
        1px solid rgba(197, 160, 94, 0.3);
      border-bottom:
        1px solid rgba(197, 160, 94, 0.3);
      font-size: 14px;
      line-height: 2.15;
      text-align: left;
    }

    .result-signature {
      margin: 25px 0 0;
      color: var(--gold);
      font-size: 12px;
      letter-spacing: 0.14em;
      text-align: right;
    }

    /* =========================
       フッター
    ========================= */

    .site-footer {
      padding: 42px 20px;
      text-align: center;
      color: #f9f2e7;
      background:
        linear-gradient(
          135deg,
          #59493f,
          #736052
        );
    }

    .footer-name {
      margin: 0;
      font-size: 17px;
      letter-spacing: 0.14em;
    }

    .footer-copy {
      margin: 13px 0 0;
      color: rgba(255, 248, 239, 0.72);
      font-size: 11px;
    }

    /* =========================
       スマホ
    ========================= */

    @media (max-width: 600px) {
      .header-name {
        font-size: 13px;
      }

      .page-main {
        padding: 88px 13px 48px;
        background-attachment: scroll;
      }

      .intro-panel,
      .result-panel {
        border-radius: 22px;
      }

      .intro-message br {
        display: none;
      }

      .envelope-area {
        margin-top: 25px;
      }

      .envelope {
        width: 225px;
        height: 140px;
      }

      .envelope-flap::before {
        top: -71px;
        width: 160px;
        height: 160px;
      }

      .wax-seal {
        top: 60px;
      }

      .main-button {
        width: 100%;
        min-width: 0;
      }

      .message-body {
        padding: 23px 18px;
      }
    }
  </style>
</head>

<body>

  <!-- ヘッダー -->
  <header class="site-header">

    <a
      class="header-brand"
      href="index.html"
      aria-label="ホームへ戻る"

  <footer class="site-footer">

      Tarot Letter

      カードが綴る、あなたへの一通の手紙。
    </p>
  </footer>

  <script>
    /* =========================
       大アルカナ22枚
    ========================= */

    const cards = [
      {
        image: "images/cards/00-TheFool.jpg",
        nameJp: "愚者",
        nameEn: "The Fool",
        keyword: "自由・始まり・好奇心",

    /* =========================
       要素
    ========================= */

    const introPanel =
      document.getElementById("introPanel");

    const resultPanel =
      document.getElementById("resultPanel");

    const drawButton =
      document.getElementById("drawButton");

    const redrawButton =
      document.getElementById("redrawButton");

    const envelope =
      document.getElementById("envelope");

    const tarotCardFrame =
      document.getElementById("tarotCardFrame");

    const tarotCardImage =
      document.getElementById("tarotCardImage");

    const resultDate =
      document.getElementById("resultDate");

    const cardNameJp =
      document.getElementById("cardNameJp");

    const cardNameEn =
      document.getElementById("cardNameEn");

    const cardKeyword =
      document.getElementById("cardKeyword");

    const messageTitle =
      document.getElementById("messageTitle");

    const messageBody =
      document.getElementById("messageBody");

    /* =========================
       日付
    ========================= */

    function getTodayKey() {
      const today = new Date();

      const year =
        today.getFullYear();

      const month =
        String(
          today.getMonth() + 1
        ).padStart(2, "0");

      const date =
        String(
          today.getDate()
        ).padStart(2, "0");

      return `${year}-${month}-${date}`;
    }

    function getDisplayDate() {
      return new Intl.DateTimeFormat(
        "ja-JP",
        {
          year: "numeric",
          month: "long",
          day: "numeric",
          weekday: "long"
        }
      ).format(new Date());
    }

    /* =========================
       カード抽選
    ========================= */

    function chooseRandomCard() {
      const randomIndex =
        Math.floor(
          Math.random() * cards.length
        );

      return cards[randomIndex];
    }

    function getTodayCard() {
      const todayKey =
        getTodayKey();

      const savedDate =
        localStorage.getItem(
          "tarotLetterTodayDate"
        );

      const savedIndex =
        localStorage.getItem(
          "tarotLetterTodayCard"
        );

      if (
        savedDate === todayKey &&
        savedIndex !== null
      ) {
        const parsedIndex =
          Number(savedIndex);

        if (
          Number.isInteger(parsedIndex) &&
          cards[parsedIndex]
        ) {
          return cards[parsedIndex];
        }
      }

      const newIndex =
        Math.floor(
          Math.random() * cards.length
        );

      localStorage.setItem(
        "tarotLetterTodayDate",
        todayKey
      );

      localStorage.setItem(
        "tarotLetterTodayCard",
        String(newIndex)
      );

      return cards[newIndex];
    }

    /* =========================
       結果表示
    ========================= */

    function setCardContent(card) {
      resultDate.textContent =
        getDisplayDate();

      tarotCardImage.src =
        card.image;

      tarotCardImage.alt =
        `${card.nameJp} ${card.nameEn}`;

      cardNameJp.textContent =
        card.nameJp;

      cardNameEn.textContent =
        card.nameEn;

      cardKeyword.textContent =
        card.keyword;

      messageTitle.textContent =
        card.title;

      messageBody.textContent =
        card.message;
    }

    function showResult(card) {
      setCardContent(card);

      introPanel.style.display =
        "none";

      resultPanel.classList.add(
        "show"
      );

      tarotCardFrame.classList.remove(
        "reveal"
      );

      void tarotCardFrame.offsetWidth;

      tarotCardFrame.classList.add(
        "reveal"
      );

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    /* =========================
       最初に引く
    ========================= */

    drawButton.addEventListener(
      "click",
      () => {
        drawButton.disabled = true;

        envelope.classList.add("open");

        setTimeout(() => {
          const selectedCard =
            getTodayCard();

          introPanel.classList.add(
            "hide"
          );

          setTimeout(() => {
            showResult(selectedCard);

            drawButton.disabled = false;
          }, 520);
        }, 1200);
      }
    );

    /* =========================
       引き直し
    ========================= */

    redrawButton.addEventListener(
      "click",
      () => {
        const selectedCard =
          chooseRandomCard();

        setCardContent(selectedCard);

        tarotCardFrame.classList.remove(
          "reveal"
        );

        void tarotCardFrame.offsetWidth;

        tarotCardFrame.classList.add(
          "reveal"
        );

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      }
    );

    /* =========================
       ハンバーガーメニュー
    ========================= */

    const menuButton =
      document.getElementById(
        "menuButton"
      );

    const mainMenu =
      document.getElementById(
        "mainMenu"
      );

    function openMenu() {
      menuButton.classList.add(
        "active"
      );

      mainMenu.classList.add(
        "open"
      );

      menuButton.setAttribute(
        "aria-expanded",
        "true"
      );

      menuButton.setAttribute(
        "aria-label",
        "メニューを閉じる"
      );

      mainMenu.setAttribute(
        "aria-hidden",
        "false"
      );

      document.body.classList.add(
        "menu-open"
      );
    }

    function closeMenu() {
      menuButton.classList.remove(
        "active"
      );

      mainMenu.classList.remove(
        "open"
      );

      menuButton.setAttribute(
        "aria-expanded",
        "false"
      );

      menuButton.setAttribute(
        "aria-label",
        "メニューを開く"
      );

      mainMenu.setAttribute(
        "aria-hidden",
        "true"
      );

      document.body.classList.remove(
        "menu-open"
      );
    }

    menuButton.addEventListener(
      "click",
      () => {
        if (
          mainMenu.classList.contains(
            "open"
          )
        ) {
          closeMenu();
        } else {
          openMenu();
        }
      }
    );

    mainMenu.addEventListener(
      "click",
      (event) => {
        if (event.target === mainMenu) {
          closeMenu();
        }
      }
    );

    document
      .querySelectorAll(".menu-list a")
      .forEach((link) => {
        link.addEventListener(
          "click",
          closeMenu
        );
      });

    document.addEventListener(
      "keydown",
      (event) => {
        if (event.key === "Escape") {
          closeMenu();
        }
      }
    );
  </script>
