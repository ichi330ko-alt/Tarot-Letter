<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>今日の一枚｜Tarot Letter</title>

  <meta
    name="description"
    content="今日のあなたへ、タロットカードから届く一通の手紙。"
  >

  <style>
    :root {
      --ivory: #fbf7ef;
      --paper: rgba(255, 252, 246, 0.92);
      --brown: #5d493d;
      --brown-light: #8c7463;
      --gold: #c7a15c;
      --gold-light: #e0c68f;
      --shadow: rgba(75, 53, 36, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--brown);
      background: var(--ivory);
      font-family:
        "Noto Serif JP",
        "Yu Mincho",
        "Hiragino Mincho ProN",
        serif;
      line-height: 1.9;
      letter-spacing: 0.05em;
    }

    body.menu-open {
      overflow: hidden;
    }

    img {
      display: block;
      max-width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    /* =========================
       ヘッダー
    ========================= */

    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      width: 100%;
      padding: 10px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(251, 247, 239, 0.84);
      border-bottom: 1px solid rgba(199, 161, 92, 0.22);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-logo {
      width: 42px;
      height: 42px;
      object-fit: contain;
      border-radius: 50%;
    }

    .header-name {
      font-size: 14px;
      letter-spacing: 0.12em;
    }

    .menu-button {
      width: 44px;
      height: 44px;
      padding: 0;
      display: grid;
      place-items: center;
      color: var(--brown);
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid rgba(199, 161, 92, 0.38);
      border-radius: 50%;
      cursor: pointer;
    }

    .menu-lines {
      position: relative;
      width: 20px;
      height: 14px;
    }

    .menu-lines span {
      position: absolute;
      left: 0;
      width: 100%;
      height: 1px;
      background: currentColor;
      transition: 0.3s ease;
    }

    .menu-lines span:nth-child(1) {
      top: 0;
    }

    .menu-lines span:nth-child(2) {
      top: 6px;
    }

    .menu-lines span:nth-child(3) {
      top: 12px;
    }

    .menu-button.active .menu-lines span:nth-child(1) {
      top: 6px;
      transform: rotate(45deg);
    }

    .menu-button.active .menu-lines span:nth-child(2) {
      opacity: 0;
    }

    .menu-button.active .menu-lines span:nth-child(3) {
      top: 6px;
      transform: rotate(-45deg);
    }

    /* =========================
       メニュー
    ========================= */

    .menu-overlay {
      position: fixed;
      inset: 0;
      z-index: 900;
      padding-top: 65px;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      background: rgba(72, 55, 43, 0.25);
      opacity: 0;
      visibility: hidden;
      transition: 0.3s ease;
    }

    .menu-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .menu-panel {
      width: min(88%, 360px);
      height: calc(100vh - 65px);
      padding: 34px 28px;
      overflow-y: auto;
      background:
        linear-gradient(
          rgba(255, 252, 247, 0.98),
          rgba(247, 239, 226, 0.98)
        );
      box-shadow: -12px 18px 40px rgba(78, 58, 42, 0.22);
      transform: translateX(105%);
      transition: 0.35s ease;
    }

    .menu-overlay.open .menu-panel {
      transform: translateX(0);
    }

    .menu-title {
      margin: 0 0 24px;
      color: var(--gold);
      font-size: 12px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    .menu-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .menu-list li {
      border-bottom: 1px solid rgba(199, 161, 92, 0.24);
    }

    .menu-list a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 17px 4px;
      font-size: 15px;
    }

    .menu-icon {
      width: 27px;
      text-align: center;
      font-size: 18px;
    }

    /* =========================
       ページ全体
    ========================= */

    .page {
      min-height: 100svh;
      padding: 105px 18px 65px;
      display: flex;
      justify-content: center;
      background:
        linear-gradient(
          rgba(255, 251, 244, 0.18),
          rgba(255, 251, 244, 0.32)
        ),
        url("images/today-bg.png")
        center center / cover
        fixed no-repeat;
    }

    .page-inner {
      width: min(100%, 820px);
      margin: auto;
      text-align: center;
    }

    .page-kicker {
      margin: 0 0 8px;
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    .page-title {
      margin: 0;
      font-size: clamp(28px, 6vw, 44px);
      font-weight: 400;
      letter-spacing: 0.14em;
    }

    .ornament {
      width: 120px;
      height: 1px;
      margin: 22px auto;
      background:
        linear-gradient(
          to right,
          transparent,
          var(--gold),
          transparent
        );
    }

    .intro-text {
      max-width: 600px;
      margin: 0 auto;
      color: var(--brown-light);
      font-size: 14px;
      line-height: 2.1;
    }

    /* =========================
       封筒
    ========================= */

    .draw-area {
      margin-top: 38px;
    }

    .envelope-stage {
      position: relative;
      min-height: 360px;
      display: grid;
      place-items: center;
    }

    .envelope {
      position: relative;
      width: min(82vw, 360px);
      aspect-ratio: 1.55 / 1;
      overflow: hidden;
      background:
        linear-gradient(
          145deg,
          #fffdf7,
          #eee2ce
        );
      border: 1px solid rgba(183, 139, 72, 0.48);
      border-radius: 8px;
      box-shadow:
        0 24px 55px rgba(91, 64, 40, 0.2),
        inset 0 0 30px rgba(255, 255, 255, 0.72);
      cursor: pointer;
      transition:
        transform 0.4s ease,
        box-shadow 0.4s ease,
        opacity 0.5s ease;
    }

    .envelope:hover {
      transform: translateY(-5px);
      box-shadow:
        0 30px 65px rgba(91, 64, 40, 0.25),
        inset 0 0 30px rgba(255, 255, 255, 0.72);
    }

    .envelope.hidden {
      opacity: 0;
      transform: translateY(25px) scale(0.92);
      pointer-events: none;
    }

    .envelope-back {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          30deg,
          transparent 49.5%,
          rgba(194, 153, 89, 0.35) 50%,
          transparent 50.5%
        ),
        linear-gradient(
          -30deg,
          transparent 49.5%,
          rgba(194, 153, 89, 0.35) 50%,
          transparent 50.5%
        );
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 58%;
      background:
        linear-gradient(
          150deg,
          #f8efdf,
          #fffdf8
        );
      border-bottom: 1px solid rgba(183, 139, 72, 0.34);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top center;
      transition: transform 0.75s ease;
    }

    .envelope.open .envelope-flap {
      transform: rotateX(180deg);
    }

    .wax-seal {
      position: absolute;
      top: 49%;
      left: 50%;
      width: 66px;
      height: 66px;
      display: grid;
      place-items: center;
      color: #fff8e9;
      background:
        radial-gradient(
          circle at 35% 30%,
          #e2bc73,
          #b78339 62%,
          #8c6029
        );
      border: 3px double rgba(255, 239, 199, 0.66);
      border-radius: 50%;
      box-shadow:
        0 8px 20px rgba(99, 62, 26, 0.28),
        inset 0 0 10px rgba(255, 237, 194, 0.35);
      font-size: 25px;
      transform: translate(-50%, -50%);
      transition:
        opacity 0.35s ease,
        transform 0.5s ease;
    }

    .envelope.open .wax-seal {
      opacity: 0;
      transform: translate(-50%, -50%) scale(1.35);
    }

    .envelope-label {
      position: absolute;
      bottom: 22px;
      left: 0;
      width: 100%;
      color: #8f745a;
      font-size: 12px;
      letter-spacing: 0.14em;
    }

    .draw-button {
      margin-top: 28px;
      min-width: 240px;
      padding: 15px 30px;
      color: #fffdf8;
      background:
        linear-gradient(
          135deg,
          #b88d48,
          #d4b471
        );
      border: 1px solid rgba(255, 255, 255, 0.56);
      border-radius: 999px;
      box-shadow: 0 13px 30px rgba(145, 101, 46, 0.27);
      cursor: pointer;
      font-size: 14px;
      letter-spacing: 0.12em;
      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
    }

    .draw-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 17px 38px rgba(145, 101, 46, 0.34);
    }

    .draw-button:disabled {
      opacity: 0.65;
      cursor: default;
      transform: none;
    }

    /* =========================
       カード結果
    ========================= */

    .result {
      display: none;
      opacity: 0;
      transform: translateY(25px);
    }

    .result.show {
      display: block;
      animation: resultAppear 1s ease forwards;
    }

    @keyframes resultAppear {
      from {
        opacity: 0;
        transform: translateY(28px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-panel {
      width: min(100%, 710px);
      margin: 0 auto;
      padding: clamp(28px, 6vw, 55px);
      background: rgba(255, 252, 246, 0.88);
      border: 1px solid rgba(199, 161, 92, 0.38);
      border-radius: 28px;
      box-shadow: 0 25px 70px rgba(85, 61, 40, 0.2);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .card-display {
      perspective: 1100px;
    }

    .tarot-card {
      position: relative;
      width: min(58vw, 225px);
      aspect-ratio: 0.58 / 1;
      margin: 0 auto;
      transform-style: preserve-3d;
      transform: rotateY(180deg);
      animation: cardTurn 1.35s ease forwards;
    }

    @keyframes cardTurn {
      0% {
        opacity: 0;
        transform:
          translateY(35px)
          rotateY(180deg)
          scale(0.87);
      }

      45% {
        opacity: 1;
      }

      100% {
        opacity: 1;
        transform:
          translateY(0)
          rotateY(0deg)
          scale(1);
      }
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 16px;
      overflow: hidden;
      box-shadow:
        0 18px 42px rgba(74, 50, 31, 0.28),
        0 0 0 1px rgba(173, 128, 60, 0.45);
    }

    .card-front {
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      color: #6e533d;
      background:
        radial-gradient(
          circle at center,
          rgba(255, 255, 255, 0.95),
          rgba(238, 222, 194, 0.9)
        );
      border: 7px solid #fbf4e7;
      outline: 1px solid rgba(182, 135, 66, 0.64);
      outline-offset: -12px;
    }

    .card-back {
      transform: rotateY(180deg);
      background:
        radial-gradient(
          circle at center,
          #f9efd8 0 13%,
          transparent 14%
        ),
        repeating-radial-gradient(
          circle at center,
          rgba(201, 161, 91, 0.3) 0 1px,
          transparent 2px 12px
        ),
        linear-gradient(
          145deg,
          #796a5a,
          #a58b6e
        );
      border: 8px solid #f6ebd5;
      outline: 1px solid rgba(190, 150, 78, 0.72);
      outline-offset: -13px;
    }

    .card-number {
      font-size: 12px;
      letter-spacing: 0.12em;
    }

    .card-symbol {
      display: grid;
      place-items: center;
      width: 110px;
      height: 110px;
      color: var(--gold);
      border: 1px solid rgba(190, 147, 79, 0.48);
      border-radius: 50%;
      font-size: 62px;
      line-height: 1;
      box-shadow:
        inset 0 0 25px rgba(207, 168, 98, 0.14);
    }

    .card-name-small {
      font-size: 12px;
      letter-spacing: 0.1em;
    }

    .result-label {
      margin: 32px 0 0;
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
    }

    .result-title {
      margin: 8px 0 0;
      font-size: clamp(27px, 6vw, 41px);
      font-weight: 400;
      letter-spacing: 0.13em;
    }

    .result-keywords {
      margin: 15px 0 0;
      color: #9a7b5c;
      font-size: 13px;
      letter-spacing: 0.1em;
    }

    .message-box {
      position: relative;
      margin-top: 30px;
      padding: 29px 25px;
      color: #6e5847;
      background: rgba(255, 255, 255, 0.54);
      border-top: 1px solid rgba(199, 161, 92, 0.32);
      border-bottom: 1px solid rgba(199, 161, 92, 0.32);
      font-size: 15px;
      line-height: 2.15;
    }

    .message-box::before {
      content: "✦";
      position: absolute;
      top: -13px;
      left: 50%;
      padding: 0 12px;
      color: var(--gold);
      background: #fbf7ef;
      transform: translateX(-50%);
    }

    .action-note {
      margin: 25px 0 0;
      color: var(--brown-light);
      font-size: 13px;
      line-height: 2;
    }

    .result-buttons {
      margin-top: 30px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .result-button {
      min-width: 190px;
      padding: 13px 23px;
      color: var(--brown);
      background: rgba(255, 252, 245, 0.76);
      border: 1px solid rgba(188, 143, 74, 0.48);
      border-radius: 999px;
      cursor: pointer;
      font-size: 13px;
      letter-spacing: 0.1em;
      transition:
        transform 0.3s ease,
        background 0.3s ease;
    }

    .result-button:hover {
      transform: translateY(-2px);
      background: rgba(255, 252, 245, 0.98);
    }

    .home-link {
      margin-top: 30px;
      display: inline-block;
      color: #927453;
      font-size: 12px;
      border-bottom: 1px solid rgba(146, 116, 83, 0.38);
    }

    /* =========================
       スマートフォン
    ========================= */

    @media (max-width: 600px) {
      .page {
        min-height: 100svh;
        padding:
          92px
          15px
          48px;
        background-attachment: scroll;
      }

      .page-title {
        font-size: 29px;
      }

      .intro-text {
        font-size: 13px;
      }

      .envelope-stage {
        min-height: 305px;
      }

      .envelope {
        width: min(89vw, 350px);
      }

      .result-panel {
        padding: 34px 18px;
        border-radius: 21px;
      }

      .tarot-card {
        width: min(62vw, 215px);
      }

      .message-box {
        padding: 27px 17px;
        font-size: 14px;
      }

      .result-buttons {
        flex-direction: column;
      }

      .result-button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- ヘッダー -->
  <header class="site-header">

    <a
      class="header-brand"

  <!-- ハンバーガーメニュー -->
  <div

  <main class="page">

    <div class="page-inner">

      <p class="page-kicker">

      </p>

      <h1 class="page-title">
        今日の一枚

      <div class="ornament"></div>

  </main>

  <script>
    /* =========================
       今日の一枚 カードデータ
       現在は大アルカナ22枚
    ========================= */

    const cards = [
      {
        number: "0",
        title: "愚者",
        english: "THE FOOL",
        symbol: "✧",
        keywords: "自由・始まり・好奇心",
        message:
          "まだ答えが見えていなくても、心が惹かれる方向へ小さく踏み出してみましょう。すべてを理解してから進む必要はありません。今日のあなたには、少し肩の力を抜いて流れを信じることが求められています。",
        action:
          "今日の小さな一歩：いつもとは少し違う選択を、一つだけ楽しんでみてください。"
      },
      {
        number: "I",
        title: "魔術師",
        english: "THE MAGICIAN",
        symbol: "✦",
        keywords: "創造・意志・可能性",
        message:
          "必要なものは、すでにあなたの中にあります。今は誰かの許可を待つより、自分の力を信じて動き始める時です。小さな行動であっても、意志を込めることで流れは変わっていきます。",
        action:
          "今日の小さな一歩：考えていることを、実際の行動に一つ移してみましょう。"
      },
      {
        number: "II",
        title: "女教皇",
        english: "THE HIGH PRIESTESS",
        symbol: "☾",

    /* =========================
       要素を取得
    ========================= */

    const envelope = document.getElementById("envelope");
    const envelopeStage = document.getElementById("envelopeStage");
    const drawButton = document.getElementById("drawButton");
    const result = document.getElementById("result");
    const redrawButton = document.getElementById("redrawButton");

    const cardNumber = document.getElementById("cardNumber");
    const cardSymbol = document.getElementById("cardSymbol");
    const cardEnglish = document.getElementById("cardEnglish");
    const cardTitle = document.getElementById("cardTitle");
    const cardKeywords = document.getElementById("cardKeywords");
    const cardMessage = document.getElementById("cardMessage");
    const cardAction = document.getElementById("cardAction");

    let drawing = false;

    /* =========================
       カードを一枚選ぶ
    ========================= */

    function selectRandomCard() {
      const randomIndex =
        Math.floor(Math.random() * cards.length);

      return cards[randomIndex];
    }

    /* =========================
       結果を表示
    ========================= */

    function showCardResult(card) {
      cardNumber.textContent = card.number;
      cardSymbol.textContent = card.symbol;
      cardEnglish.textContent = card.english;
      cardTitle.textContent = card.title;
      cardKeywords.textContent = card.keywords;
      cardMessage.textContent = card.message;
      cardAction.textContent = card.action;

      result.classList.remove("show");

      void result.offsetWidth;

      result.classList.add("show");

      setTimeout(() => {
        result.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      }, 250);
    }

    /* =========================
       封筒を開く
    ========================= */

    function drawCard() {
      if (drawing) {
        return;
      }

      drawing = true;

      drawButton.disabled = true;
      drawButton.textContent = "手紙を開いています…";

      envelope.classList.add("open");

      setTimeout(() => {
        envelope.classList.add("hidden");
      }, 650);

      setTimeout(() => {
        envelopeStage.style.display = "none";
        drawButton.style.display = "none";

        const selectedCard = selectRandomCard();

        showCardResult(selectedCard);

        drawing = false;
      }, 1150);
    }

    drawButton.addEventListener("click", drawCard);

    envelope.addEventListener("click", drawCard);

    envelope.addEventListener("keydown", (event) => {
      if (
        event.key === "Enter" ||
        event.key === " "
      ) {
        event.preventDefault();
        drawCard();
      }
    });

    /* =========================
       もう一枚引く
    ========================= */

    redrawButton.addEventListener("click", () => {
      result.classList.remove("show");
      result.style.display = "none";

      envelope.classList.remove("open", "hidden");
      envelopeStage.style.display = "grid";

      drawButton.style.display = "inline-block";
      drawButton.disabled = false;
      drawButton.textContent = "今日の手紙を受け取る";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

      setTimeout(() => {
        result.style.display = "";
      }, 450);
    });

    /* =========================
       ハンバーガーメニュー
    ========================= */

    const menuButton = document.getElementById("menuButton");
    const mainMenu = document.getElementById("mainMenu");

    function openMenu() {
      menuButton.classList.add("active");
      mainMenu.classList.add("open");

      menuButton.setAttribute(
        "aria-expanded",
        "true"
      );

      menuButton.setAttribute(
        "aria-label",
        "メニューを閉じる"
      );

      mainMenu.setAttribute(
        "aria-hidden",
        "false"
      );

      document.body.classList.add("menu-open");
    }

    function closeMenu() {
      menuButton.classList.remove("active");
      mainMenu.classList.remove("open");

      menuButton.setAttribute(
        "aria-expanded",
        "false"
      );

      menuButton.setAttribute(
        "aria-label",
        "メニューを開く"
      );

      mainMenu.setAttribute(
        "aria-hidden",
        "true"
      );

      document.body.classList.remove("menu-open");
    }

    menuButton.addEventListener("click", () => {
      const isOpen =
        mainMenu.classList.contains("open");

      if (isOpen) {
        closeMenu();
      } else {
        openMenu();
      }
    });

    mainMenu.addEventListener("click", (event) => {
      if (event.target === mainMenu) {
        closeMenu();
      }
    });

    document
      .querySelectorAll(".menu-list a")
      .forEach((link) => {
        link.addEventListener("click", closeMenu);
      });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeMenu();
      }
    });
